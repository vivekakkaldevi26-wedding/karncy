<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile & Multi-Device Live Studio Emulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .device-shell {
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1), 
                  height 0.35s cubic-bezier(0.16, 1, 0.3, 1), 
                  border-radius 0.35s ease,
                  transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: center center;
    }
    .pixel-frame {
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.85),
                  0 0 0 10px #1e293b,
                  0 0 0 12px #334155,
                  0 0 0 14px rgba(255, 255, 255, 0.1);
    }
    .samsung-frame {
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.9),
                  0 0 0 8px #0f172a,
                  0 0 0 10px #475569,
                  0 0 0 12px rgba(255, 255, 255, 0.15);
    }
    .iphone-frame {
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.85),
                  0 0 0 12px #18181b,
                  0 0 0 14px #27272a,
                  0 0 0 16px rgba(255, 255, 255, 0.1);
    }
    .touch-cursor {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(255, 105, 0, 0.8);
      background: rgba(255, 105, 0, 0.3);
      border-radius: 50%;
      position: absolute;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: width 0.1s, height 0.1s, background-color 0.1s;
      z-index: 100;
      display: none;
    }
    .touch-cursor.active {
      width: 32px;
      height: 32px;
      background: rgba(255, 105, 0, 0.6);
    }
  </style>
</head>
<body class="bg-[#07090e] text-slate-100 min-h-screen flex flex-col items-center justify-between select-none overflow-x-hidden">

  <!-- Top Studio Control Bar -->
  <header class="w-full max-w-7xl px-4 py-3 border-b border-white/10 bg-slate-900/60 backdrop-blur-2xl sticky top-0 z-50 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center shadow-lg shadow-orange-500/20 text-white font-black text-lg">
        📱
      </div>
      <div>
        <h1 class="text-sm font-bold text-white leading-tight">Mobile Device Studio Emulator</h1>
        <p class="text-[11px] text-emerald-400 font-mono font-medium">● ACTIVE &amp; RUNNING</p>
      </div>
    </div>

    <!-- Device Selector Pills -->
    <div class="flex items-center gap-2 bg-slate-950/80 p-1.5 rounded-2xl border border-white/10 flex-wrap">
      <button onclick="setDevice('iphone15pro')" id="btn-iphone15pro" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-orange-600 text-white transition-all shadow-md">
        iPhone 15 Pro
      </button>
      <button onclick="setDevice('pixel8pro')" id="btn-pixel8pro" class="px-3 py-1.5 rounded-xl text-xs font-medium text-slate-300 hover:text-white transition-all">
        Pixel 8 Pro
      </button>
      <button onclick="setDevice('s24ultra')" id="btn-s24ultra" class="px-3 py-1.5 rounded-xl text-xs font-medium text-slate-300 hover:text-white transition-all">
        Galaxy S24 Ultra
      </button>
      <button onclick="setDevice('zfold5')" id="btn-zfold5" class="px-3 py-1.5 rounded-xl text-xs font-medium text-slate-300 hover:text-white transition-all">
        Galaxy Z Fold 5
      </button>
      <button onclick="setDevice('pixelTablet')" id="btn-pixelTablet" class="px-3 py-1.5 rounded-xl text-xs font-medium text-slate-300 hover:text-white transition-all">
        Tablet
      </button>
    </div>

    <!-- Live URL & Preset Controls -->
    <div class="flex items-center gap-2 flex-1 max-w-lg">
      <div class="relative w-full flex items-center">
        <span class="absolute left-3 text-slate-500 text-xs font-mono">🌐</span>
        <input
          type="text"
          id="url-input"
          value="https://karncy.vercel.app"
          placeholder="Enter URL..."
          class="w-full bg-slate-950 border border-white/10 rounded-xl pl-8 pr-20 py-1.5 text-xs text-slate-200 font-mono focus:outline-none focus:border-orange-500 transition-colors"
        />
        <button
          onclick="loadUrl()"
          class="absolute right-1 px-2.5 py-1 bg-orange-600 hover:bg-orange-500 text-white rounded-lg text-[11px] font-bold transition-all"
        >
          GO
        </button>
      </div>

      <select id="sample-select" onchange="loadPresetSample()" class="bg-slate-950 border border-white/10 text-slate-300 text-xs rounded-xl px-2.5 py-1.5 focus:outline-none focus:border-orange-500">
        <option value="https://karncy.vercel.app">Karncy (Live Production)</option>
        <option value="http://localhost:5173">Karncy (Local Dev 5173)</option>
        <option value="http://localhost:3000">Wedding Project (3000)</option>
      </select>
    </div>

    <!-- Transform Controls -->
    <div class="flex items-center gap-2">
      <button
        onclick="toggleOrientation()"
        title="Toggle Portrait / Landscape"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-white/10 text-xs font-semibold text-white transition-all"
      >
        <span id="rotate-icon">🔄</span>
        <span id="orientation-label">Portrait</span>
      </button>

      <select id="scale-select" onchange="updateScale()" class="bg-slate-800/80 border border-white/10 text-slate-200 text-xs font-semibold rounded-xl px-2.5 py-1.5 focus:outline-none">
        <option value="1">100%</option>
        <option value="0.85" selected>85%</option>
        <option value="0.75">75%</option>
        <option value="0.6">60%</option>
      </select>
    </div>
  </header>

  <!-- Main Viewport Stage -->
  <main class="flex-1 w-full flex items-center justify-center p-6 overflow-auto relative">
    <div class="fixed top-1/3 left-1/2 -translate-x-1/2 w-[700px] h-[700px] bg-orange-500/10 rounded-full blur-[160px] pointer-events-none -z-10"></div>

    <div id="device-wrapper" style="transform: scale(0.85); transform-origin: top center;" class="transition-transform duration-200">
      <div
        id="device-frame"
        class="device-shell iphone-frame relative bg-black flex flex-col overflow-hidden"
        style="width: 393px; height: 852px; border-radius: 48px;"
      >
        <div id="touch-cursor" class="touch-cursor"></div>

        <!-- Mobile Status Bar -->
        <div id="mobile-status-bar" class="w-full h-8 bg-black/90 text-white flex items-center justify-between px-6 text-[12px] font-medium font-mono select-none z-40 relative">
          <span id="status-clock">12:30</span>
          
          <div id="punch-hole" class="w-3.5 h-3.5 bg-black rounded-full border border-neutral-800 shadow-inner flex items-center justify-center absolute left-1/2 -translate-x-1/2 top-2 hidden">
            <div class="w-1.5 h-1.5 bg-[#0f172a] rounded-full"></div>
          </div>

          <div id="dynamic-island" class="w-28 h-7 bg-black rounded-full absolute top-2.5 left-1/2 -translate-x-1/2 z-50 flex items-center justify-end px-3">
            <div class="w-2.5 h-2.5 rounded-full bg-[#111827] border border-neutral-700"></div>
          </div>

          <div class="flex items-center gap-1.5 text-[11px] opacity-90">
            <span>5G</span>
            <span>📶</span>
            <span>🔋 98%</span>
          </div>
        </div>

        <!-- Emulator Screen -->
        <iframe
          id="emulator-screen"
          src="https://karncy.vercel.app"
          class="w-full flex-1 border-0 bg-white transition-opacity duration-200"
          title="Mobile Emulator Screen"
        ></iframe>

        <!-- Bottom Gesture Bar -->
        <div id="bottom-bar" class="w-full h-6 bg-black/95 flex items-center justify-center px-8 z-40 relative select-none">
          <div id="gesture-pill" class="w-28 h-1 bg-white/60 rounded-full hover:bg-white transition-all cursor-pointer"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="w-full max-w-7xl px-4 py-2.5 border-t border-white/10 bg-slate-950/80 backdrop-blur-xl flex flex-wrap items-center justify-between text-xs text-slate-400">
    <div class="flex items-center gap-4 font-mono">
      <span id="telemetry-device" class="text-orange-400 font-semibold">Apple iPhone 15 Pro (iOS 17)</span>
      <span>•</span>
      <span id="telemetry-res">393 × 852 px</span>
      <span>•</span>
      <span id="telemetry-dpr">DPR: 3.0</span>
    </div>

    <div class="flex items-center gap-3">
      <span class="text-slate-500">Live Touch &amp; Scroll Emulation Ready</span>
    </div>
  </footer>

  <script>
    const deviceConfigs = {
      iphone15pro: {
        name: 'Apple iPhone 15 Pro (iOS 17)',
        w: 393,
        h: 852,
        dpr: 3.0,
        radius: '48px',
        style: 'iphone-frame',
        notchType: 'dynamic-island'
      },
      pixel8pro: {
        name: 'Google Pixel 8 Pro (Android 14)',
        w: 412,
        h: 892,
        dpr: 2.625,
        radius: '44px',
        style: 'pixel-frame',
        notchType: 'punch-hole'
      },
      s24ultra: {
        name: 'Samsung Galaxy S24 Ultra (One UI 6.1)',
        w: 384,
        h: 832,
        dpr: 3.0,
        radius: '18px',
        style: 'samsung-frame',
        notchType: 'punch-hole'
      },
      zfold5: {
        name: 'Galaxy Z Fold 5 - Unfolded (Android 14)',
        w: 816,
        h: 1032,
        dpr: 2.625,
        radius: '28px',
        style: 'samsung-frame',
        notchType: 'punch-hole'
      },
      pixelTablet: {
        name: 'Google Pixel Tablet (Android 14)',
        w: 1280,
        h: 800,
        dpr: 2.0,
        radius: '28px',
        style: 'pixel-frame',
        notchType: 'none'
      }
    };

    let currentDeviceKey = 'iphone15pro';
    let isLandscape = false;

    const deviceFrame = document.getElementById('device-frame');
    const deviceWrapper = document.getElementById('device-wrapper');
    const screenIframe = document.getElementById('emulator-screen');
    const urlInput = document.getElementById('url-input');
    const sampleSelect = document.getElementById('sample-select');
    const scaleSelect = document.getElementById('scale-select');
    const punchHole = document.getElementById('punch-hole');
    const dynamicIsland = document.getElementById('dynamic-island');
    const orientationLabel = document.getElementById('orientation-label');
    const telemetryDevice = document.getElementById('telemetry-device');
    const telemetryRes = document.getElementById('telemetry-res');
    const telemetryDpr = document.getElementById('telemetry-dpr');

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('status-clock').innerText = `${hours}:${mins}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function setDevice(deviceKey) {
      currentDeviceKey = deviceKey;
      const dev = deviceConfigs[deviceKey];

      Object.keys(deviceConfigs).forEach((k) => {
        const btn = document.getElementById(`btn-${k}`);
        if (btn) {
          if (k === deviceKey) {
            btn.className = 'px-3 py-1.5 rounded-xl text-xs font-semibold bg-orange-600 text-white transition-all shadow-md';
          } else {
            btn.className = 'px-3 py-1.5 rounded-xl text-xs font-medium text-slate-300 hover:text-white transition-all';
          }
        }
      });

      deviceFrame.className = `device-shell ${dev.style} relative bg-black flex flex-col overflow-hidden`;
      deviceFrame.style.borderRadius = dev.radius;

      if (dev.notchType === 'punch-hole') {
        punchHole.classList.remove('hidden');
        dynamicIsland.classList.add('hidden');
      } else if (dev.notchType === 'dynamic-island') {
        punchHole.classList.add('hidden');
        dynamicIsland.classList.remove('hidden');
      } else {
        punchHole.classList.add('hidden');
        dynamicIsland.classList.add('hidden');
      }

      applyDimensions();
    }

    function applyDimensions() {
      const dev = deviceConfigs[currentDeviceKey];
      const width = isLandscape ? dev.h : dev.w;
      const height = isLandscape ? dev.w : dev.h;

      deviceFrame.style.width = `${width}px`;
      deviceFrame.style.height = `${height}px`;

      telemetryDevice.innerText = dev.name;
      telemetryRes.innerText = `${width} × ${height} px`;
      telemetryDpr.innerText = `DPR: ${dev.dpr}`;
    }

    function toggleOrientation() {
      isLandscape = !isLandscape;
      orientationLabel.innerText = isLandscape ? 'Landscape' : 'Portrait';
      applyDimensions();
    }

    function updateScale() {
      const scale = scaleSelect.value;
      deviceWrapper.style.transform = `scale(${scale})`;
    }

    function loadUrl() {
      let target = urlInput.value.trim();
      if (!target) return;
      screenIframe.style.opacity = '0.3';
      screenIframe.src = target;
      setTimeout(() => {
        screenIframe.style.opacity = '1';
      }, 300);
    }

    function loadPresetSample() {
      urlInput.value = sampleSelect.value;
      loadUrl();
    }

    const touchCursor = document.getElementById('touch-cursor');
    deviceFrame.addEventListener('mouseenter', () => { touchCursor.style.display = 'block'; });
    deviceFrame.addEventListener('mouseleave', () => { touchCursor.style.display = 'none'; });
    deviceFrame.addEventListener('mousemove', (e) => {
      const rect = deviceFrame.getBoundingClientRect();
      const scale = parseFloat(scaleSelect.value);
      touchCursor.style.left = `${(e.clientX - rect.left) / scale}px`;
      touchCursor.style.top = `${(e.clientY - rect.top) / scale}px`;
    });
    deviceFrame.addEventListener('mousedown', () => touchCursor.classList.add('active'));
    deviceFrame.addEventListener('mouseup', () => touchCursor.classList.remove('active'));

    setDevice('iphone15pro');
  </script>
</body>
</html>
