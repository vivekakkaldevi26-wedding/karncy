name: Deploy to Hostinger

on:
  push:
    branches:
      - main
      - V2
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔨 Build Production Bundle
        run: npm run build

      - name: 🚀 Deploy to Hostinger via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: 'u985529326'
          server: '46.28.45.159'
          port: '65002'
          password: ${{ secrets.FTP_PASSWORD || 'Akkaldevi26$' }}
          local_path: './dist/*'
          remote_path: 'domains/karncy.com/public_html/live/'
          sftpArgs: '-o StrictHostKeyChecking=no -o ConnectTimeout=15'
